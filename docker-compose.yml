name: wordpress-frankenphp-mysql

services:
    wordpress:
        env_file: ".env"
        build:
            context: .
            dockerfile: ./Dockerfile
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./public/wp-config.php:/app/public/wp-config.php:ro
            - ./public/wp-content/uploads:/app/public/wp-content/uploads
            - ./log:/var/log
        depends_on:
            - db

    db:
        image: mysql:8.4
        restart: unless-stopped
        volumes:
            - db_data:/var/lib/mysql
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
        ports:
            - "3306:3306"

volumes:
    db_data:
